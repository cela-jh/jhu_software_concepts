services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/00--init.sql:ro
    healthcheck:
      # $$ expands the variable inside the container, not at compose parse time
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./src/web
    environment:
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET: ${FLASK_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  loader:
    build: ./src/web
    command: python -m database.load_data /app/data/applicant_data.json
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    volumes:
      - ./src/data:/app/data:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./src/worker
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RABBITMQ_URL: ${RABBITMQ_URL}
      SEED_JSON: ${SEED_JSON}
      TARGET_TABLE: ${TARGET_TABLE}
      ID_KEY: ${ID_KEY}
    volumes:
      - ./src/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
